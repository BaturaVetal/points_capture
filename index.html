<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра Престолів - Локації</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; margin: 0; padding: 20px; }
        .scoreboard { display: flex; justify-content: center; gap: 50px; font-size: 28px; margin-bottom: 20px; font-weight: bold; }
        .blue-score { color: #4dabf7; }
        .red-score { color: #ff6b6b; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 600px; margin: 0 auto; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(5, 1fr); max-width: 900px; } }
        .loc-btn { height: 100px; font-size: 18px; font-weight: bold; border: 2px solid #444; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .loc-btn.grey { background: #555; color: white; }
        .loc-btn.blue { background: #1864ab; color: white; border-color: #4dabf7; }
        .loc-btn.red { background: #e03131; color: white; border-color: #ff6b6b; }
        .controls { margin-top: 30px; }
        button.admin { padding: 15px 30px; font-size: 16px; margin: 10px; cursor: pointer; background: #333; color: white; border: 1px solid #777; border-radius: 5px; font-weight: bold;}
        button.admin:hover { background: #444; }
        #csv-result { margin-top: 20px; width: 100%; max-width: 800px; height: 300px; background: #222; color: #0f0; padding: 10px; font-family: monospace; display: none; margin-left: auto; margin-right: auto; white-space: pre; overflow-x: auto;}
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #333; padding: 30px; border-radius: 10px; text-align: center; border: 1px solid #555;}
        .team-btn { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; color: white; font-weight: bold;}
        .btn-blue { background: #1864ab; }
        .btn-red { background: #e03131; }
    </style>
</head>
<body>
    <h1>Війна за Царства</h1>
    <h2 id="status">Гра не почалася</h2>
    
    <div class="scoreboard">
        <div class="blue-score">Сині: <span id="score-blue">0</span></div>
        <div class="red-score">Червоні: <span id="score-red">0</span></div>
    </div>

    <div class="grid" id="locations-grid">
        <!-- Кнопки генеруються через JS -->
    </div>

    <div class="controls">
        <button class="admin" onclick="sendAction('start')">▶ Почати гру</button>
        <button class="admin" onclick="sendAction('end')">⏹ Закінчити гру (CSV)</button>
    </div>

    <textarea id="csv-result" readonly></textarea>

    <!-- Вікно для першого захоплення (сірої локації) -->
    <div id="capture-modal" class="modal">
        <div class="modal-content">
            <h3>Хто захопив локацію?</h3>
            <button class="team-btn btn-blue" onclick="captureGrey('blue')">Сині</button>
            <button class="team-btn btn-red" onclick="captureGrey('red')">Червоні</button>
            <br><br>
            <button onclick="closeModal()" style="padding:10px 20px; margin-top: 15px; cursor:pointer;">Скасувати</button>
        </div>
    </div>

    <script>
        let ws;
        let gameState = { active: false, locations: {} };
        let selectedLocId = null;

        function initWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(protocol + '//' + window.location.host + '/ws');
            
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'state') {
                    gameState = msg.data;
                    document.getElementById('csv-result').style.display = 'none';
                    updateUI();
                } else if (msg.type === 'end') {
                    document.getElementById('csv-result').style.display = 'block';
                    document.getElementById('csv-result').value = msg.csv;
                }
            };
            
            // Авто-реконект при обриві зв'язку (якщо екран телефона згас)
            ws.onclose = () => setTimeout(initWS, 2000); 
        }

        function updateUI() {
            document.getElementById('status').innerText = gameState.active ? "ГРА ТРИВАЄ" : "ГРА ЗУПИНЕНА";
            document.getElementById('status').style.color = gameState.active ? "#69db7c" : "#ffd43b";
            
            document.getElementById('score-blue').innerText = gameState.scores.blue;
            document.getElementById('score-red').innerText = gameState.scores.red;

            const grid = document.getElementById('locations-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const loc = gameState.locations[i];
                const btn = document.createElement('button');
                btn.className = `loc-btn ${loc.color}`;
                btn.innerText = `Локація ${i}`;
                btn.onclick = () => handleLocClick(i, loc.color);
                grid.appendChild(btn);
            }
        }

        function handleLocClick(id, color) {
            if (!gameState.active) {
                alert("Спочатку почніть гру (кнопка внизу)!");
                return;
            }
            
            if (color === 'grey') {
                selectedLocId = id;
                document.getElementById('capture-modal').style.display = 'flex';
            } else {
                const newTeam = color === 'blue' ? 'red' : 'blue';
                const newTeamName = newTeam === 'blue' ? 'Синій' : 'Червоний';
                
                // Захист "від дурака" (перезахоплення)
                if (confirm(`Чи справді хочете перефарбувати локацію в ${newTeamName} колір?`)) {
                    ws.send(JSON.stringify({ action: 'capture', loc_id: id, team: newTeam }));
                }
            }
        }

        function captureGrey(team) {
            ws.send(JSON.stringify({ action: 'capture', loc_id: selectedLocId, team: team }));
            closeModal();
        }

        function closeModal() {
            document.getElementById('capture-modal').style.display = 'none';
            selectedLocId = null;
        }

        function sendAction(action) {
            if (action === 'start' && !confirm("Почати нову гру? Бали та таблиці будуть обнулені!")) return;
            if (action === 'end' && !confirm("Закінчити гру і згенерувати фінальні результати?")) return;
            ws.send(JSON.stringify({ action: action }));
        }

        initWS();
    </script>
</body>
</html>
